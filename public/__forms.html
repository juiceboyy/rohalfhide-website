<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms Skeleton</title>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" type="text" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <select name="subject">
        <option value="Booking & Live Shows">Booking &amp; Live Shows</option>
        <option value="Sync & Licensing">Sync &amp; Licensing</option>
        <option value="Studio & Production">Studio &amp; Production</option>
        <option value="General Inquiry">General Inquiry</option>
      </select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
