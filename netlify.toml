[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/blogs/blog.rss"
  to = "/rss.xml"
  status = 301

[[redirects]]
  from = "/blogs/blog.atom"
  to = "/rss.xml"
  status = 301

[[redirects]]
  from = "/blogs/blog"
  to = "/news"
  status = 301

[[redirects]]
  from = "/home/blog/new-website-for-my-cover-act"
  to = "/news/new-website-for-my-cover-act"
  status = 301

[[redirects]]
